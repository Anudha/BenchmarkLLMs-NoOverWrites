[project]
name = "localbench"
version = "0.3.0"
description = "Live, daily-refreshed local business / business search benchmark, many verticals (NEEDLE-style)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "cryptography>=42"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
localbench = "localbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["localbench"]
