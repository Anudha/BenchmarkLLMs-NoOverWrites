name: daily-refresh

on:
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC daily (off the hour, Overpass is less busy)
  workflow_dispatch:
    inputs:
      verticals:
        description: "'all' or comma list: coffee_shops,grocery_produce,bike_trails"
        default: "all"
      total:
        description: "new sample points per run, split across the verticals"
        default: "20"
      city:
        description: "optional: fixed cities instead of the daily rotation, e.g. mountain_view"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: localbench-noOverwrites   # the project folder inside the repo
    env:
      GOLD_KEY: ${{ secrets.GOLD_KEY }}
      SEED_SALT: ${{ secrets.SEED_SALT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LOCALBENCH_REPO: ${{ github.repository }}
      LOCALBENCH_UA: "localbench/0.4 (https://github.com/${{ github.repository }})"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Reveal embargoed gold (yesterday and older)
        run: python -m localbench reveal --data-dir data

      - name: Generate today's run
        run: |
          python -m localbench generate --data-dir data \
            --verticals "${{ github.event.inputs.verticals || 'all' }}" \
            --total "${{ github.event.inputs.total || '20' }}" \
            ${{ github.event.inputs.city && format('--city "{0}"', github.event.inputs.city) || '' }} \
            --gold-plain-out "$RUNNER_TEMP/gold_today.csv"

      - name: Baseline engines (ddgs + nominatim always; groq if GROQ_API_KEY is set)
        continue-on-error: true   # a rate-limited free engine shouldn't block publishing
        run: |
          python -m localbench baseline --data-dir data \
            --gold "$RUNNER_TEMP/gold_today.csv" \
            --engines ddgs,groq,nominatim

      - name: Commit and push (adds files only; nothing is ever overwritten)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "data: $(date -u +%F) refresh"
          git push
